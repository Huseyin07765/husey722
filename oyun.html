
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>VS Code Voleybol - Yeşil Saha</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', sans-serif; color: white; margin: 0; overflow: hidden; }
        canvas { background: #2e7d32; border: 5px solid #ffffff; box-shadow: 0 10px 50px rgba(0,0,0,0.5); margin-top: 20px; }
        .score { font-size: 60px; font-weight: bold; margin-top: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .hint { color: #aaa; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

    <div class="score" id="scoreBoard">0 - 0</div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div class="hint">Sol: W,A,D | Sağ: Ok Tuşları</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreBoard = document.getElementById("scoreBoard");

        // --- OYUN AYARLARI ---
        const gravity = 0.35;
        const playerSize = 70; // Oyuncular biraz daha büyütüldü
        const ballRadius = 20;
        const netWidth = 10;
        const netHeight = 160;

        let p1Score = 0, p2Score = 0;

        const p1 = { x: 100, y: 300, dx: 0, dy: 0, color: "#e74c3c", jumping: false };
        const p2 = { x: 730, y: 300, dx: 0, dy: 0, color: "#3498db", jumping: false };
        const ball = { x: 450, y: 100, dx: 3, dy: 3 };

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function update() {
            // Oyuncu 1 Kontrol (Saha sınırlandırıldı)
            if (keys["a"]) p1.dx = -7; 
            else if (keys["d"]) p1.dx = 7; 
            else p1.dx = 0;
            if (keys["w"] && !p1.jumping) { p1.dy = -11; p1.jumping = true; }
            
            // Oyuncu 2 Kontrol (Saha sınırlandırıldı)
            if (keys["ArrowLeft"]) p2.dx = -7; 
            else if (keys["ArrowRight"]) p2.dx = 7; 
            else p2.dx = 0;
            if (keys["ArrowUp"] && !p2.jumping) { p2.dy = -11; p2.jumping = true; }

            // Oyuncu Fiziği ve "Karşıya Geçme" Engeli
            [p1, p2].forEach((p, index) => {
                p.dy += gravity;
                p.x += p.dx;
                p.y += p.dy;

                // Yer sınırı
                if (p.y > canvas.height - playerSize) { p.y = canvas.height - playerSize; p.dy = 0; p.jumping = false; }

                // Saha Sınırları (File engeli)
                if (index === 0) { // Sol Oyuncu
                    if (p.x < 0) p.x = 0;
                    if (p.x > canvas.width/2 - playerSize - netWidth/2) p.x = canvas.width/2 - playerSize - netWidth/2;
                } else { // Sağ Oyuncu
                    if (p.x > canvas.width - playerSize) p.x = canvas.width - playerSize;
                    if (p.x < canvas.width/2 + netWidth/2) p.x = canvas.width/2 + netWidth/2;
                }
            });

            // Top Hareketi
            ball.dy += gravity * 0.6;
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top Duvar Sekmesi
            if (ball.x < ballRadius || ball.x > canvas.width - ballRadius) ball.dx *= -0.9;
            if (ball.y < ballRadius) ball.dy *= -0.9;

            // Top - File Çarpışması
            if (ball.x + ballRadius > canvas.width/2 - netWidth/2 && 
                ball.x - ballRadius < canvas.width/2 + netWidth/2 && 
                ball.y + ballRadius > canvas.height - netHeight) {
                ball.dx *= -1;
            }

            // Top - Oyuncu Çarpışması
            [p1, p2].forEach(p => {
                let distX = ball.x - (p.x + playerSize/2);
                let distY = ball.y - (p.y + playerSize/2);
                let dist = Math.sqrt(distX*distX + distY*distY);
                if (dist < ballRadius + playerSize/2) {
                    ball.dy = -9;
                    ball.dx = distX * 0.3;
                    ball.y = p.y - ballRadius; // İçine girmesini engelle
                }
            });

            // Sayı Durumu
            if (ball.y > canvas.height + ballRadius) {
                if (ball.x < canvas.width/2) p2Score++; else p1Score++;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width/2;
            ball.y = 50;
            ball.dx = (Math.random() > 0.5 ? 3 : -3);
            ball.dy = 2;
            scoreBoard.innerText = p1Score + " - " + p2Score;
        }

        function draw() {
            // Sahayı temizle (Yeşil Arka Plan)
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Saha Çizgileri
            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.lineWidth = 5;
            ctx.strokeRect(10, 10, canvas.width-20, canvas.height-10);

            // File (Beyaz ve Belirgin)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(canvas.width/2 - netWidth/2, canvas.height - netHeight, netWidth, netHeight);

            // Oyuncular
            drawPlayer(p1);
            drawPlayer(p2);

            // Top (Beyaz voleybol topu efekti)
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPlayer(p) {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x + playerSize/2, p.y + playerSize/2, playerSize/2, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Gözler
            ctx.fillStyle = "white";
            let eyeX = p.color === "#e74c3c" ? 15 : -15;
            ctx.beginPath();
            ctx.arc(p.x + playerSize/2 + eyeX, p.y + playerSize/3, 7, 0, Math.PI*2);
            ctx.fill();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
